# =========================================================
# INFORMES (Argentinos por la Educación).
# Alimenta: Publications Archive (todos), Data & Research (featured: true)
# y la portada (home: 1, 2, 3...).
#
# Título, fecha, URL, PDF y autores se tomaron de argentinosporlaeducacion.org
# (19-nov-2026), en el orden de autoría que figura en cada página.
# Fecha = fecha de publicación en la web.
#
# Lo que falta por informe (lo escribes tú):
#   title_en, summary_en, roles, topics  -> y, en los destacados:
#   question, findings, contribution, tools, data_sources
#
# Valores para "roles":
#   data-analysis   -> Data analysis
#   indicators      -> Indicator design
#   writing         -> Writing
#   coordination    -> Coordination
#   communication   -> Communication of results
#   experts         -> Work with expert co-authors
#   media           -> TV & radio appearances
#
# Para DESTACAR un informe en "Data & Research", añade en su bloque:
#   featured: true
#   question: "..."
#   findings:
#     - "..."
#     - "..."
#   contribution: "..."
#   tools: [R, Stata]
#   data_sources: [PISA 2022]
# Para ponerlo en la portada: home: 1  (2, 3...)
#
# Para añadir uno nuevo: copia un bloque, pégalo al final y usa el siguiente id (r32...).
# =========================================================

